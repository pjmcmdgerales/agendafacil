
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgendaFácil | Acesso Administrativo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; background: #10213e;
      font-family: Arial, sans-serif;
    }
    .card {
      background: white; width: 100%; max-width: 420px;
      padding: 36px; border-radius: 16px;
      box-shadow: 0 15px 40px #0003;
    }
    h1 { color: #10213e; margin-bottom: 5px; }
    .sub { color: #64748b; margin-bottom: 28px; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }
    input {
      width: 100%; padding: 13px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 15px;
    }
    button {
      width: 100%; margin-top: 24px; padding: 14px;
      border: 0; border-radius: 8px;
      background: #10b981; color: #082f26;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #087e67; }
    .forgot { text-align: right; margin-top: 13px; }
    #message { margin-top: 16px; color: #b91c1c; }
    .footer { margin-top: 26px; color: #64748b; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Agenda<span style="color:#10b981">Fácil</span></h1>
    <p class="sub">Central Administrativa | Acesso restrito</p>

    <form id="login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required
             placeholder="Digite seu e-mail">

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password"
             required placeholder="Digite sua senha">

      <div class="forgot">
        <a href="#" id="forgot">Esqueci minha senha</a>
      </div>

      <button id="submit" type="submit">Entrar no painel</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="footer">AgendaFácil | Administração Geral</div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("login");
    const message = document.getElementById("message");
    const button = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await sb.auth.signInWithPassword({
          email, password
        });
        if (error) throw error;

        const { data: profile, error: profileError } = await sb
          .from("profiles")
          .select("role")
          .eq("id", data.user.id)
          .single();

        if (profileError || profile?.role !== "admin") {
          await sb.auth.signOut();
          throw new Error("Usuário sem permissão de Administrador Geral.");
        }

        window.location.replace("./painel.html");
      } catch (error) {
        message.textContent = error.message || "Não foi possível entrar.";
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("forgot").addEventListener("click", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();

      if (!email) {
        message.textContent = "Informe seu e-mail antes de recuperar a senha.";
        return;
      }

      const redirectTo = new URL("./redefinir-senha.html", location.href).href;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

      message.style.color = error ? "#b91c1c" : "#087e67";
      message.textContent = error
        ? "Não foi possível solicitar a recuperação."
        : "Se o e-mail estiver cadastrado, você receberá instruções.";
    });
  </script>
</body>
</html>
